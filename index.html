    $('#cc', pn).onclick = async function () { await post('/api/library-action', { action: 'clear-cache' }); toast('Caches vidés'); };
  } else if (tab === 'users') {
    var ud = await api('/api/admin/users'); pn.innerHTML = '<h3>Profils</h3><p class="msg">Chaque profil a sa propre progression, sa liste et ses préférences. Un PIN protège l’accès ; le profil enfant est limité aux bibliothèques choisies. <b>Conseil :</b> mettez un PIN sur votre profil administrateur pour protéger les réglages.</p><div class="acts" style="margin:0 0 14px"><button class="btn red" id="au">Ajouter un profil</button></div><div id="ul2"></div>';
    var redraw = function () { ROUTES.settings(v, ['users']); };
    ud.users.forEach(function (u) { var r = el('div', 'lrow', '<div class="avatar">' + esc(u.name.charAt(0).toUpperCase()) + '</div><div class="t"><b>' + esc(u.name) + '</b><small>' + (u.admin ? 'Administrateur · ' : '') + (u.kid ? 'Enfant · ' : '') + (u.pin ? 'PIN activé' : 'Sans PIN') + (u.libs ? ' · ' + u.libs.length + ' bibliothèque(s)' : ' · toutes les bibliothèques') + (u.iptv === false ? ' · sans IPTV' : '') + '</small></div><button class="btn sm">Modifier</button><button class="btn sm danger">Supprimer</button>'); var b = $$('button', r);
      b[0].onclick = function () { userDlg(u, cfg.libraries, redraw); }; b[1].onclick = function () { confirmBox('Supprimer le profil « ' + u.name + ' » et sa progression ?', async function () { try { await post('/api/admin/users', { action: 'delete', id: u.id }); redraw(); } catch (e) { toast(e.message); } }, 'Supprimer'); }; $('#ul2', pn).append(r); });
    $('#au', pn).onclick = function () { userDlg(null, cfg.libraries, redraw); };
  } else if (tab === 'iptv') {
    var x = cfg.xtream || {}; pn.innerHTML = '<h3>Xtream Codes</h3><label class="fld">Adresse du serveur</label><input id="xh" placeholder="http://serveur:port" value="' + esc(x.host || '') + '"><label class="fld">Utilisateur</label><input id="xu" value="' + esc(x.user || '') + '" autocomplete="off"><label class="fld">Mot de passe' + (x.user ? ' (vide = inchangé)' : '') + '</label><input id="xp" type="password" autocomplete="new-password">' +
      '<h3>Playlist M3U</h3><label class="fld">Adresse (URL) de la playlist</label><input id="mu" placeholder="http://…/get.php?username=…&password=…&type=m3u_plus" value="' + esc(cfg.m3u || '') + '"><div class="acts" style="margin-top:16px"><button class="btn red" id="sv">Enregistrer</button><button class="btn" id="ts">Tester la connexion</button></div><p class="msg" id="tr"></p><p class="msg">Depuis la télé : ouvrez TV en direct, choisissez une chaîne ; dans le lecteur, <b>Haut / Bas</b> change de chaîne, <b>Gauche</b> ouvre la liste, les <b>chiffres</b> saisissent un numéro, et ★ ajoute aux favoris.</p>';
    $('#sv').onclick = async function () { await save({ xtream: { host: $('#xh').value, user: $('#xu').value, pass: $('#xp').value }, m3u: $('#mu').value }, 'IPTV enregistré'); Object.keys(XTC).forEach(function (k) { delete XTC[k]; }); };
    $('#ts').onclick = async function () { var t = $('#tr'); t.textContent = 'Test en cours…'; try { var c = await api('/api/xt?action=get_live_categories'); t.textContent = Array.isArray(c) ? '✓ Connexion réussie : ' + c.length + ' catégories de chaînes.' : '✗ Réponse inattendue (identifiants incorrects ?).'; } catch (e) { t.textContent = '✗ ' + e.message + ' (enregistrez d’abord, puis testez)'; } };
  } else if (tab === 'meta') {
    pn.innerHTML = '<h3>Affiches, résumés, casting (TMDB)</h3><p class="msg">Créez un compte gratuit sur themoviedb.org → Paramètres → API, puis collez ici la clé API (v3) ou le « jeton d’accès en lecture » (v4).</p><label class="fld">Clé TMDB' + (cfg.tmdb.set ? ' (déjà enregistrée, vide = inchangée)' : '') + '</label><input id="tk" type="password" autocomplete="new-password"><p class="msg" style="color:' + (cfg.tmdb.error ? '#ff8a8a' : '#46d369') + '">' + (cfg.tmdb.error ? esc(cfg.tmdb.error) : (cfg.tmdb.set ? '✓ Clé enregistrée' : '')) + '</p><div class="acts"><button class="btn red" id="sv">Enregistrer</button>' + (cfg.tmdb.set ? '<button class="btn ghost" id="rm">Retirer la clé</button>' : '') + '<button class="btn ghost" id="rf">Actualiser toutes les fiches</button></div>';
    $('#sv').onclick = async function () { await save({ tmdb: $('#tk').value }, 'Clé enregistrée, récupération des fiches en cours…'); pollScan(); ROUTES.settings(v, ['meta']); }; if ($('#rm')) $('#rm').onclick = async function () { await save({ clearTmdb: true }, 'Clé retirée'); ROUTES.settings(v, ['meta']); };
    $('#rf').onclick = async function () { await post('/api/library-action', { action: 'refresh' }); toast('Actualisation lancée'); pollScan(); };
  } else if (tab === 'transcode') {
    var ff = await api('/api/ffmpeg'), tr = cfg.transcoder;
    pn.innerHTML = '<h3>ffmpeg : lecture de tous les formats</h3><p class="msg" id="fs">' + (ff.ffmpeg ? '✓ ffmpeg détecté' + (ff.ffprobe ? ' (avec ffprobe : pistes audio, sous-titres intégrés et informations techniques)' : ' (sans ffprobe)') + '. Les fichiers MKV, AVI, TS, HEVC, audio AC3/DTS… sont convertis automatiquement en H.264/AAC pour tous vos appareils.' : '✗ ffmpeg non trouvé : seuls les formats lisibles directement par l’appareil fonctionnent (MP4 H.264…).') + '</p>' +
      (!ff.ffmpeg ? (ff.platform === 'win32' ? '<button class="btn red" id="fi">Installer ffmpeg automatiquement (≈130 Mo)</button><p class="msg">Sinon, téléchargez ffmpeg et placez <b>ffmpeg.exe</b> et <b>ffprobe.exe</b> à côté de TBSA-Serveur.exe.</p>' : '<p class="msg">Installez ffmpeg avec votre gestionnaire de paquets (par exemple <b>sudo apt install ffmpeg</b>) puis relancez le serveur.</p>') : '') +
      '<h3>Transcodeur</h3><label class="fld">Accélération matérielle</label><select id="th"><option value="none">Aucune (processeur, libx264)</option>' + ['nvenc', 'qsv', 'amf'].map(function (h) { var en = ff.encoders.indexOf('h264_' + h) >= 0; return '<option value="' + h + '"' + (en ? '' : ' disabled') + '>' + { nvenc: 'NVIDIA NVENC', qsv: 'Intel Quick Sync', amf: 'AMD AMF' }[h] + (en ? '' : ' (non disponible dans ce ffmpeg)') + '</option>'; }).join('') + '</select><label class="fld">Vitesse d’encodage (processeur)</label><select id="tp">' + ['ultrafast', 'superfast', 'veryfast', 'faster', 'fast', 'medium'].map(function (p2) { return '<option>' + p2 + '</option>'; }).join('') + '</select><label class="fld">Conversions simultanées maximum</label><input id="tm" type="number" min="1" max="12" value="' + tr.maxSessions + '" style="width:120px"><div class="acts" style="margin-top:16px"><button class="btn red" id="sv">Enregistrer</button></div>';
    $('#th').value = tr.hw; $('#tp').value = tr.preset; $('#sv').onclick = function () { save({ transcoder: { hw: $('#th').value, preset: $('#tp').value, maxSessions: $('#tm').value } }); };
    if ($('#fi')) $('#fi').onclick = async function () { await post('/api/ffmpeg/install'); var f = $('#fs'); S.actT = setInterval(async function () { var s = await api('/api/ffmpeg'); f.textContent = s.install.msg || 'Installation…'; if (s.install.state !== 'running') { clearInterval(S.actT); if (s.install.state === 'done') { await reloadAll(); ROUTES.settings(v, ['transcode']); } } }, 3000); $('#fi').disabled = true; };
  } else if (tab === 'network') {
    var nw = await api('/api/network'); pn.innerHTML = '<h3>Se connecter depuis la télé ou un autre appareil</h3>' + (nw.urls.length ? '<p class="msg">Sur la télé (ou tout appareil du même réseau), ouvrez le navigateur et tapez :</p>' + nw.urls.map(function (u) { return '<p><b style="color:#ff5a63;font-size:22px">' + esc(u) + '/?tv=1</b></p>'; }).join('') + '<p class="msg">Le <b>?tv=1</b> active le mode télécommande (flèches, OK, Retour). L’application Android (téléphone / Android TV) trouve le serveur automatiquement.</p>' : '<p class="msg">Aucune adresse réseau trouvée : vérifiez que le PC est connecté au Wi-Fi ou au câble.</p>') + '<p class="msg">Windows : si la télé ne voit pas le serveur, lancez <b>autoriser-pare-feu.bat</b> (clic droit → Exécuter en tant qu’administrateur).</p>' + '<h3>Installer l’application sur un stick TV (Fire TV, Android TV, Google TV)</h3>' + (nw.apk && nw.urls.length ? '<p class="msg">Sur le stick, installez l’application gratuite <b>Downloader</b>, ouvrez-la et tapez cette adresse :</p>' + nw.urls.map(function (u) { return '<p><b style="color:#ff5a63;font-size:22px">' + esc(u) + '/apk</b></p>'; }).join('') + '<p class="msg">Acceptez l’installation, puis lancez « TBSA ». Elle retrouve le serveur toute seule. Détails dans LISEZMOI-STICK.txt.</p>' : '<p class="msg">Le fichier <b>TBSA-Serveur.apk</b> n’est pas encore sur le serveur. Obtenez-le avec LISEZMOI-STICK.txt, puis placez-le à côté de TBSA-Serveur.exe : il sera téléchargeable depuis le stick à l’adresse <b>http://IP-DU-PC:' + nw.port + '/apk</b>. En attendant, le navigateur du stick (Silk, Firefox, TV Bro) peut ouvrir <b>http://IP-DU-PC:' + nw.port + '/?tv=1</b>.</p>') + '<h3>Accès depuis l’extérieur</h3><p class="msg">Le serveur est conçu pour le réseau local. Pour regarder hors de chez vous, utilisez un VPN privé (par exemple Tailscale) plutôt que d’ouvrir le port 8585 sur Internet, et protégez vos profils avec un PIN.</p>';
  } else if (tab === 'activity') {
    pn.innerHTML = '<h3>Lecture en cours</h3><div id="an"></div><h3>Bibliothèque</h3><div class="kv" id="as"></div><h3>Historique récent</h3><div id="ah"></div><h3>Journal du serveur</h3><pre class="log" id="lg"></pre>';
    var load = async function () {
      var a = await api('/api/activity'), lg = await api('/api/logs'); if (!$('#an')) return;
      $('#an').innerHTML = a.now.length ? a.now.map(function (s) { return '<div class="lrow"><div class="t"><b>' + esc(s.title) + '</b><small>' + esc(s.u) + ' · ' + esc(s.mode) + (s.q && s.q !== 'orig' ? ' (' + esc(s.q) + ')' : '') + ' · ' + esc(s.ip) + (s.dur ? ' · ' + fmtT(s.pos) + ' / ' + fmtT(s.dur) : ' · en direct') + '</small></div></div>'; }).join('') : '<p class="msg">Aucune lecture en cours.</p>';
      var st = a.stats, up = a.uptime; $('#as').innerHTML = [[st.movies, 'Films'], [st.shows, 'Séries'], [st.episodes, 'Épisodes'], [st.other, 'Autres vidéos'], [fmtSize(st.size), 'Taille totale'], [a.transcodes, 'Conversions actives'], [st.users, 'Profils'], [Math.floor(up / 3600) + ' h ' + Math.floor(up % 3600 / 60) + ' min', 'En marche depuis']].map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('');
      $('#ah').innerHTML = a.hist.length ? a.hist.slice(0, 15).map(function (h) { return '<div class="msg">' + new Date(h.t).toLocaleString('fr-FR') + ' · <b style="color:#eee">' + esc(h.u) + '</b> · ' + esc(h.title) + ' <span style="color:#777">(' + esc(h.mode) + ')</span></div>'; }).join('') : '<p class="msg">Aucun historique.</p>';
      var pre = $('#lg'); var bottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40; pre.textContent = lg.lines.join('\n'); if (bottom) pre.scrollTop = pre.scrollHeight;
    };
    await load(); S.actT = setInterval(function () { load().catch(function () {}); }, 4000);
  }
};

boot();
</script>
